<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>PokeAPI- CN</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="css/index.css">
    </head>
    <body>

        <!-- Contenedor 1: Botones originales -->
        <div class="container" style="margin-top: 40px;">
            <a href="#" id="txtBtn" class="button">Cargar TXT</a>
            <a href="#" id="jsonBtn" class="button">Cargar JSON</a>
            <a href="#" id="apiBtn" class="button">Cargar API</a>
        </div>

        <!-- Nueva Sección: Búsqueda PokeAPI -->
        <div class="container poke-search-container">
            <input type="text" id="pokeInput" placeholder="Ej: pikachu o 25" autocomplete="off">
            <a href="#" id="pokeBtn" class="button btn-poke">Buscar Pokémon</a>
        </div>

        <!-- Contenedor 2: Salida de resultados -->
        <div class="container">
            <div id="resultado"></div>
        </div>

        <script src="js/app.js" async defer></script>
    </body>
</html>
